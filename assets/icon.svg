<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep obsidian background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1c1c21" />
      <stop offset="55%" stop-color="#0b0b0e" />
      <stop offset="100%" stop-color="#030304" />
    </radialGradient>

    <!-- Outer metallic bezel gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#71717a" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#27272a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#e4e4e7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Primary Lunar Crescent Gradient -->
    <linearGradient id="lunaGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#d4d4d8" />
      <stop offset="100%" stop-color="#52525b" />
    </linearGradient>

    <!-- Mirror Reflection Crescent Gradient -->
    <linearGradient id="mirrorGrad" x1="85%" y1="90%" x2="15%" y2="10%">
      <stop offset="0%" stop-color="#e4e4e7" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#71717a" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.05" />
    </linearGradient>

    <!-- Core Singularity Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#e4e4e7" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#71717a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#71717a" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.45" />
    </linearGradient>

    <!-- Soft Drop Shadow & Glow Filter -->
    <filter id="lunarGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle inner grid pattern -->
    <pattern id="portalGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04" />
    </pattern>

    <clipPath id="squircleClip">
      <rect x="24" y="24" width="464" height="464" rx="112" ry="112" />
    </clipPath>
  </defs>

  <!-- Main App Squircle Container -->
  <g clip-path="url(#squircleClip)">
    <!-- Base Obsidian Fill -->
    <rect x="24" y="24" width="464" height="464" fill="url(#bgGrad)" />

    <!-- Architectural Perspective Grid -->
    <rect x="24" y="24" width="464" height="464" fill="url(#portalGrid)" />

    <!-- Ambient Top Spotlight -->
    <circle cx="256" cy="40" r="240" fill="url(#coreGlow)" opacity="0.35" />

    <!-- Concentric Portal Depth Rings -->
    <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
    <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ringLinear)" stroke-width="1.2" stroke-dasharray="6 10" opacity="0.5" />
    <circle cx="256" cy="256" r="138" fill="none" stroke="url(#ringLinear)" stroke-width="1.5" opacity="0.4" />

    <!-- Diagonal Mirror Axis Line (Symbolizing "Mirror everything.") -->
    <line x1="86" y1="426" x2="426" y2="86" stroke="url(#ringLinear)" stroke-width="1.2" stroke-dasharray="3 6" opacity="0.45" />

    <!-- Tilted Orbital Mirror Ellipses -->
    <g transform="rotate(-32 256 256)">
      <ellipse cx="256" cy="256" rx="186" ry="68" fill="none" stroke="url(#ringLinear)" stroke-width="1.75" opacity="0.65" />
      <ellipse cx="256" cy="256" rx="186" ry="68" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="45 360" stroke-linecap="round" opacity="0.9" />
      <!-- Orbital Nodes (Mirrors) -->
      <circle cx="70" cy="256" r="5" fill="#ffffff" filter="url(#lunarGlow)" />
      <circle cx="442" cy="256" r="4" fill="#a1a1aa" />
    </g>

    <g transform="rotate(58 256 256)">
      <ellipse cx="256" cy="256" rx="164" ry="52" fill="none" stroke="url(#ringLinear)" stroke-width="1" opacity="0.35" />
      <circle cx="92" cy="256" r="3.5" fill="#d4d4d8" />
      <circle cx="420" cy="256" r="3.5" fill="#71717a" />
    </g>

    <!-- Central Singularity Horizon Glow -->
    <circle cx="256" cy="256" r="105" fill="url(#coreGlow)" opacity="0.55" />

    <!-- Upper-Left Primary Lunar Crescent (The Source) -->
    <path d="M 210 132
             A 126 126 0 1 0 380 302
             A 104 104 0 1 1 210 132 Z"
          fill="url(#lunaGrad)"
          filter="url(#lunarGlow)" />

    <!-- Lower-Right Mirrored Lunar Crescent (The Reflection) -->
    <path d="M 302 380
             A 126 126 0 1 0 132 210
             A 104 104 0 1 1 302 380 Z"
          fill="url(#mirrorGrad)" />

    <!-- Inner Glass Portal Core -->
    <circle cx="256" cy="256" r="54" fill="#09090b" stroke="url(#ringLinear)" stroke-width="1.5" />

    <!-- Symmetrical Diamond Starburst in Center -->
    <path d="M 256 212 C 256 242 256 242 226 256 C 256 270 256 270 256 300 C 256 270 256 270 286 256 C 256 242 256 242 256 212 Z"
          fill="#ffffff"
          filter="url(#lunarGlow)" />
    <circle cx="256" cy="256" r="4" fill="#ffffff" />

    <!-- Subtle Specular Top Arc Highlight -->
    <path d="M 70 110 Q 256 36 442 110" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" />
  </g>

  <!-- Outer Precision Bezel Frame -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="none" stroke="url(#bezelGrad)" stroke-width="4" />
  <rect x="28" y="28" width="456" height="456" rx="108" ry="108" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
</svg>
