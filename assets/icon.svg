<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="lunaPortal logo">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.5" stop-color="#4CC9F0"/>
      <stop offset="1" stop-color="#B388FF"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFD8FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="512" height="512" fill="black"/>
      <circle cx="256" cy="256" r="104" fill="white"/>
      <circle cx="298" cy="220" r="96" fill="black"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0B0F1A"/>
  <circle cx="256" cy="256" r="176" fill="url(#glow)"/>

  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.35"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="14"/>

  <circle cx="256" cy="256" r="104" fill="url(#moon)" mask="url(#crescent)"/>

  <circle cx="168" cy="176" r="6" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="344" cy="336" r="4" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="196" cy="352" r="3" fill="#FFFFFF" opacity="0.45"/>
</svg>
