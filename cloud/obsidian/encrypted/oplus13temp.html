<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F0E12" />
    <title>OPlus 13 Unbrick</title>
    <style>
      :root {
        --bg-base: #0F0E12;
        --bg-surface: #16151A;
        --bg-elevated: #1D1C22;
        --text-primary: #EDEAF0;
        --text-secondary: #A9A4B2;
        --text-muted: #6B6675;
        --border-subtle: #26252C;
        --border-active: #3D3A47;
        --accent-primary: #A78BFA;
        --accent-secondary: #7DD3C0;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --transition-fast: 150ms ease;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border-radius: 0 !important;
      }

      html,
      body {
        min-height: 100vh;
        background-color: var(--bg-base);
        color: var(--text-primary);
        font-family: var(--font-sans);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow-x: hidden;
      }

      .wrapper {
        width: 100%;
        max-width: 440px;
      }

      .card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        padding: 36px 32px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      }

      .icon-box {
        width: 44px;
        height: 44px;
        border: 1px solid var(--border-subtle);
        background-color: var(--bg-base);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--accent-primary);
        margin-bottom: 24px;
      }

      h1 {
        font-family: var(--font-mono);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text-primary);
        margin-bottom: 12px;
      }

      p.description {
        font-size: 13px;
        line-height: 1.6;
        color: var(--text-secondary);
        margin-bottom: 28px;
      }

      .btn-download {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 13px 20px;
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-decoration: none;
        color: #0F0E12;
        background-color: var(--accent-primary);
        border: 1px solid var(--accent-primary);
        cursor: pointer;
        transition: opacity var(--transition-fast), filter var(--transition-fast);
      }

      .btn-download:hover {
        opacity: 0.9;
      }

      .btn-download:active {
        filter: brightness(0.95);
      }

      .btn-download:focus-visible {
        outline: 2px solid var(--accent-primary);
        outline-offset: 3px;
      }

      .file-meta {
        margin-top: 20px;
        border-top: 1px solid var(--border-subtle);
        padding-top: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="card">
        <div class="icon-box" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M21 15V19H3V15" />
            <path d="M7 10L12 15L17 10" />
            <path d="M12 3V15" />
          </svg>
        </div>

        <h1>OnePlus 13 - UnBrick - First Version</h1>
        <p class="description">encrypted tools. not opensource</p>

        <a href="https://drive.google.com/file/d/1jUfN9t1FMlElKgr_1Fazwp3uH_35WYnk/view?usp=sharing" target="_blank" rel="noreferrer noopener" class="btn-download">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
            <path d="M21 15V19H3V15" />
            <path d="M7 10L12 15L17 10" />
            <path d="M12 3V15" />
          </svg>
          Download
        </a>

        <div class="file-meta">
          <span>Target: google drive</span>
          <span>Direct Link</span>
        </div>
      </div>
    </div>
  </body>
</html>
